<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rain World Map</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <meta property="og:image" content="https://alduris.github.io/mod-map/embed.jpg" />
    <meta property="og:type" content="object" />
    <meta property="og:title" content="Rain World Map" />
    <meta property="og:url" content="https://alduris.github.io/mod-map/" />
    <meta property="og:description" content="A custom, online interactive map for regions, vanilla or modded, in Rain World." />
    <link rel="stylesheet" href="./rw.css" />
    <link rel="stylesheet" href="./leaflet/leaflet.css" />

    <script src="./global.js"></script>
    <script src="./leaflet/leaflet.js"></script>
    <script src="./beziero.js"></script>
    <script src="./jszip.min.js"></script>

    <style id="mapstyle">
        body,
        html {
            height: 100%;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        #mapid {
            height: 100%;
            padding: 0;
            margin: 0;
            background: black;
        }

        .room-labels {
            opacity: 0.4;
            pointer-events: auto;
            padding-top: 3px;
            padding-bottom: 3px;
            color: white;
            background-color: black;
            border: none;
        }

        .spawn-divs {
            display: flex;
            justify-content: center;
        }

        .spawn-entry {
            display: none;
            /* to be overwritten */
            margin-left: 16px;
            margin-right: 16px;
        }

        .lineage-entry {
            height: 24px;
        }
        .lineage-entry.tall {
            height: 30px;
        }

        .roomtag-divs {
            display: flex;
            justify-content: center;
        }

        .object-divs {
            display: flex;
            justify-content: center;
        }

        .object-entry {
            margin-left: 16px;
            margin-right: 16px;
        }

        .object-label {
            position: absolute;
            margin-left: 0px;
            margin-top: -5px;
            font-weight: 900;
            font-size: 125%;
            color: white;
            -webkit-text-fill-color: white;
            /* Will override color (regardless of order) */
            -webkit-text-stroke-width: 1px;
            -webkit-text-stroke-color: black;
        }

        .object-tooltip {
            position: absolute;
            margin-left: 0px;
            margin-top: 0px;
            font-weight: 900;
            font-size: 125%;
            color: white;
            -webkit-text-fill-color: white;
            /* Will override color (regardless of order) */
            -webkit-text-stroke-width: 1px;
            -webkit-text-stroke-color: black;
        }

        .object-image {
            position: absolute;
            margin-left: -25px;
            margin-top: -25px;
        }

        .rse-image {
            position: absolute;
            margin-left: -25px;
            margin-top: -25px;
        }

        .roomtag-entry {
            display: none;
            /* to be overwritten */
            margin-left: 16px;
            margin-right: 16px;
        }

        .roomtag-label {
            position: absolute;
            margin-left: 0px;
            margin-top: 10px;
            font-weight: 700;
            font-size: 125%;
            color: white;
            -webkit-text-fill-color: white;
            /* Will override color (regardless of order) */
            -webkit-text-stroke-width: 1px;
            -webkit-text-stroke-color: black;
            font-family: var(--font-body);
        }

        .roomtag-image {
            position: absolute;
            margin-left: -45px;
            margin-top: 0px;
        }

        .warppoint-image {
            position: absolute;
            transform: translate(-50%, -50%) scale(0.5);
            border: 4px solid white;
            border-radius: 50%;
        }

        .warpdest-circle {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background-color: #5b4fde;
            border: 2px solid white;
            border-radius: 50%;
        }
        .warpdest-circle.badwarp {
            background-color: #5f1cd4;
        }

        .warpdest-label {
            position: absolute;
            margin-left: 0px;
            /* margin-top: -5px; */
            font-weight: 900;
            font-size: 112.5%;
            color: white;
            -webkit-text-fill-color: white;
            /* Will override color (regardless of order) */
            -webkit-text-stroke-width: 1px;
            -webkit-text-stroke-color: black;
            pointer-events: none;
        }

        .icon-image {
            position: absolute;
            margin-left: -25px;
            margin-top: -25px;
        }

        .icon-label {
            position: absolute;
            font-weight: 900;
            font-size: 100%;
            color: white;
            -webkit-text-fill-color: white;
            /* Will override color (regardless of order) */
            -webkit-text-stroke-width: 1px;
            -webkit-text-stroke-color: black;
        }

        .icon-tooltip {
            position: absolute;
            margin-left: 0px;
            margin-top: -16px;
            font-weight: 900;
            font-size: 125%;
            color: white;
            -webkit-text-fill-color: white;
            /* Will override color (regardless of order) */
            -webkit-text-stroke-width: 1px;
            -webkit-text-stroke-color: black;
        }

        .overlay-label {
            position: relative;
            width: 160px;
            height: 36px;
            margin-top: 11px;
            margin-bottom: 11px;
        }

        /* UI stuff */
        .side-panel {
            position: absolute;
            top: 24px;
            max-height: calc(100vh - 54px);
            display: flex;
            flex-direction: column;
            padding: 8px;
            background: #0c0c0c;
            z-index: 1000;
            color: #cccccc;
        }

        /* Difficulty select and layers panel */
        .right-panel {
            right: 24px;
        }

        .difficulty-select {
            padding-bottom: 6px;
            width: 150px;
            position: relative;
            /* re-center after wrap */
            margin-left: auto;
            margin-right: auto;
            padding: 4px;
            transition: width 0.4s;
        }

        .difficulty-btn {
            display: inline-block;
            width: 38px;
            height: 38px;
            margin: 4px;
            position: relative;
        }

        #layer-content {
            padding: 8px;
        }

        .left-panel {
            left: 24px;
        }

        .region-btn {
            font-size: 0.8rem;
            width: 240px;
            height: 24px;
            position: relative;
        }
        .region-btn:not(details > .region-btn) {
            margin-top: 8px;
            margin-bottom: 8px;
        }

        details.rw-ui {
            border-radius: 8px;
            border: 2px solid #686672;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        details.rw-ui > summary {
            background: #686672;
            color: black;
            padding: 4px 8px;
            font-family: var(--font-body);
            font-weight: 600;
            user-select: none;
        }
        .region-sublist {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            padding: 6px;
        }

        a {
            color: #999;
        }

        input[type='radio'].rw-ui + span {
            top: calc(50% - 10px);
            /* proof that CSS is stupid, cant fucking vertical center text */
        }

        #region-select {
            padding-left: 8px;
            padding-right: 8px;
        }

        .scroll-ish {
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 24px !important;
            margin-right: -16px !important;
        }

        .hidden {
            display: none !important;
        }

        .collapse-tab {
            display: none;
            width: 30px;
            height: 30px;
            user-select: none;
            background: #0c0c0c;
            background-image: url(./resources/hamburger.png);
            background-repeat: no-repeat;
            background-position: center;
        }

        @media screen and (max-width: 640px) {
            .overlay-label {
                height: 28px;
            }
            input[type="checkbox"].rw-ui + span {
                top: calc(50% - 10px);
            }
        }

        @media (max-width: 899px) {
            .side-panel {
                transition: left ease 0.3s, right ease 0.3s;
            }
            .collapse-tab {
                display: block;
                cursor: pointer;
            }

            .left-panel.collapsed {
                left: var(--hide-pos);
            }

            .right-panel.collapsed {
                right: var(--hide-pos);
            }

            .left-panel .collapse-tab {
                position: absolute;
                right: -30px;
                border-top-right-radius: 4px;
                border-bottom-right-radius: 4px;
            }

            .right-panel .collapse-tab {
                position: absolute;
                left: -30px;
                border-top-left-radius: 4px;
                border-bottom-left-radius: 4px;
            }

            .collapsed .scroll-ish {
                overflow-y: hidden;
            }
        }
    </style>


    <style id="spawnfilters">
        .spawn-filter {
            display: initial
        }

        .object-filter {
            display: initial
        }

        .roomtag-filter {
            display: initial
        }

        .warppoint-filter {
            display: initial
        }

        .warpdest-filter {
            display: initial
        }

        .rse-filter {
            display: initial
        }
    </style>

    <style id="hoverlabels">
        .hover-label {
            display: none;
        }
    </style>

    <style>
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 10px;
            padding: 20px 24px;
            min-width: 280px;
            max-width: 90vw;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            position: relative;
        }
        .modal-box h2 {
            margin: 0 0 10px;
            font-size: 18px;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 14px;
            cursor: pointer;
            font-size: 20px;
            color: #888;
            background: none;
            border: none;
            line-height: 1;
        }
        .modal-close:hover { color: #222; }

        .placed-object-menu {
            position: fixed;
            display: none;
            background: #000;
            z-index: 1000;
            max-height: 25vh;
            overflow-y: auto;
            min-width: 15vw;
        }

        .placed-object-menu.open {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 4px;
            padding: 8px;
        }

        .placed-object-menu-item {
            padding: 8px 4px;
            cursor: pointer;
            color: white;
            justify-items: center;
            align-items: center;
            display: flex;
            flex-direction: column;
        }

        .placed-object-menu-item:hover {
            background-color: #333333;
        }

        .placed-object-image {
            position: absolute;
            right: -20px;
            top: -20px;
        }

        .delete-object-btn {
            position: absolute;
            right: -25px;
            top: 15px;
            width: 20px;
            height: 20px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background-color: rgba(255, 50, 50, 0.8);
            color: white;
            cursor: pointer;
            z-index: 1000;
            transition: background-color 0.2s;
        }

        .delete-object-btn:hover {
            background-color: rgba(255, 100, 100, 1);
        }
    </style>
</head>

<body>
    <div id="mapid"></div>

    <button id="exportBtn" style="position: absolute;bottom: 24px;left: 500px;z-index: 1000;">Export</button>
    <button id="uploadBtn" style="position: absolute;bottom: 24px;left: 600px;z-index: 1000;">Import .txt</button>
    <input type="file" id="fileInput" accept=".txt" multiple style="display:none" />

    <div class="modal-overlay rw-text" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2 id="modalTitle"></h2>

            <div id="spawnCards"></div>
            <button id="addSpawnBtn">+ Add spawn</button>

            <div>
                <button id="cancelBtn">Cancel</button>
                <button id="saveBtn">Save</button>
            </div>
        </div>
    </div>

    <div class="placed-object-menu" id="placedObjectMenu"></div>

    <div class="side-panel left-panel rw-text collapsible collapsed">
        <div style="padding-left: 8px; padding-bottom: 8px;">
            <a href="./" class="rw-text">&lt; Back to Index</a>
            <hr />
            <span>Regions</span>
        </div>

        <form name="regionselect" id="region-select" class="scroll-ish"></form>

        <div class="collapse-tab"></div>
    </div>

    <div class="side-panel right-panel rw-text collapsible collapsed">
        <div>Slugcat</div>
        <form name="difficulty" class="difficulty-select" id="scug-selector">
        </form>

        <div>Layers</div>
        <div id="layer-content" class="scroll-ish"></div>

        <div class="collapse-tab"></div>
    </div>

        class PlacedObjectData {
            constructor(objectType, position, room) {
                this.type = 'Feature';
                this.objectType = objectType;
                this.position = position;
                this.room = room;
                this.id = room + '_' + new Date().toISOString();
            }

            toGeoJSONFeature(absoluteCoordinates) {
                return {
                    type: 'Feature',
                    properties: {
                        object: this.objectType,
                        id: this.id,
                        room: this.room,
                        position: this.position
                    },
                    geometry: {
                        type: 'Point',
                        coordinates: absoluteCoordinates
                    }
                };
            }

            toRoomSettingsString(difficulty, filterList) {
                return objectMap[this.objectType](filterList, this.position);
            }
        }

        function fromRoomSettingsLine(line, room) {
            let parts = line.split('><');
            if (parts.length < 3) return null;
            const [objectType, xStr, yStr] = parts;
            return new PlacedObjectData(objectType.toLowerCase(), [parseFloat(xStr), parseFloat(yStr)], room);
        }

                //w.URLSearchParamsAlt = function (searchString) {
                var self = this;
                self.searchString = searchString;
                self.values = {};
                let result;
                let exp = new RegExp('[\?&]([^=]*)=([^&#]*)', 'g');
                while ((result = exp.exec(self.searchString)) != null) {
                    console.log(result);
                    self.values[result[1]] = decodeURI(result[2]);
                }
                // todo valueless
                self.get = function (name) { return self.values[name]; };
                self.set = function (name, value) { self.values[name] = value; };
                self.delete = function (name) { delete self.values[name]; };
                self.toString = function () {
                    let str;
                    for (var name in self.values) {
                        if (str) str += '&'; else str = '';
                        str += name + '=' + self.values[name];
                    }
                    if (!str) return '';
                    return '?' + str;
                };
                return self;
            }
        })(window) // URLSearchParams Polyfill-ish

                // actually changed anything

                if (dynamicNavigation) {

                } else if (!noNavigation) document.location.search = newstr;
                if (!noNavigation) newState();

                const regionButtons = [... document.querySelectorAll("input[name='regions']")];

                    document.getElementById("scug-" + slugcats[i]).classList.toggle("hidden", regions[region]["slugcats"].indexOf(slugcats[i].toLowerCase()) == -1);

        saveBtn.addEventListener('click', () => {
            const spawns = [];
            spawnCards.querySelectorAll('.spawn-card').forEach((card) => {
                const isLineage = card.querySelector('.f-is-lineage').checked;
                const amountRaw = card.querySelector('.f-amount').value;
                const spawnDataRaw = card.querySelector('.f-spawn-data').value.trim();

                const spawn = {
                    is_lineage: isLineage,
                    amount: amountRaw === '' ? 0 : Number(amountRaw),
                    creature: card.querySelector('.f-creature').value.trim(),
                    spawn_data: spawnDataRaw === '' ? null : spawnDataRaw
                };

                if (isLineage) {
                    const lineage = [];
                    const lineageProbs = [];
                    const lineageData = [];
                    card.querySelectorAll('.lineage-row').forEach((row) => {
                        lineage.push(row.querySelector('.l-creature').value.trim());
                        lineageProbs.push(row.querySelector('.l-prob').value.trim());
                        const dataVal = row.querySelector('.l-data').value.trim();
                        lineageData.push(dataVal === '' ? null : dataVal);
                    });
                    spawn.lineage = lineage;
                    spawn.lineage_probs = lineageProbs;
                    spawn.lineage_data = lineageData;
                }

                spawns.push(spawn);
            });

            var _spawns = nodeToSpawn(currentNode, loadedDifficulty);

                _spawns.properties.spawns = spawns;
            }
            else {
                const newSpawnFeature = {
                    type: "Feature",
                    properties: {
                        room: currentNode.properties.room,
                        den: parseInt(currentNode.properties.name.split("_")[3]),
                        spawns: spawns
                    },
                    geometry: {
                        type: "Point",
                        coordinates: [currentNode.geometry.coordinates[0], currentNode.geometry.coordinates[1]]
                    }
                };
                regionJson[`${loadedDifficulty}-${region}`]["spawn_features"].push(newSpawnFeature);
            }
            overlay.classList.remove('open');
            currentNode = null;

            drawSpawns(loadedDifficulty);
        });

        function spawnFeaturesToWorldTxt(spawnFeatures, originalSpawnFeatures) {
            let lines = [];
            for (const feature of originalSpawnFeatures) {
                var room = feature.properties.room;
                if (room.toLowerCase().includes("offscreen"))
                    room = "OFFSCREEN";
                const den = feature.properties.den;
                for (const spawn of feature.properties.spawns) {
                    var creature = spawn.creature;
                    const amount = spawn.amount;
                    const spawnData = spawn.spawn_data ?? '';
                    var spawnStr = `[FINDLINESTART]`;
                    if (spawn.is_lineage) {
                        spawnStr += "LINEAGE : ";
                    }
                    spawnStr += `${room} : ${den}`;
                    lines.push(spawnStr);
                    lines.push(`[ADDBEFORE](X-${loadedDifficulty.charAt(0).toUpperCase() + loadedDifficulty.slice(1)})`);
                }
            }

            var origSpawnsMap = {};
            lines.push("[MERGE]");
            lines.push("CREATURES");
            for (const feature of originalSpawnFeatures) {
                var room = feature.properties.room;
                if (room.toLowerCase().includes("offscreen"))
                    room = "OFFSCREEN";
                if (origSpawnsMap[room] == null)
                    origSpawnsMap[room] = [];
                const den = feature.properties.den;
                for (const spawn of feature.properties.spawns) {
                    var creature = spawn.creature;
                    const amount = spawn.amount;
                    const spawnData = spawn.spawn_data ?? '';
                    var spawnStr = `(${loadedDifficulty.charAt(0).toUpperCase() + loadedDifficulty.slice(1)})`;
                    if (spawn.is_lineage) {
                        spawnStr += "LINEAGE : ";
                        spawnStr += `${room} : ${den} : `;
                        // const lineageStr = spawn.lineage.map((creature, i) => {
                        //     const prob = parseFloat(spawn.lineage_probs[i]).toString();
                        //     if (creature === "")
                        //         creature = "NONE";
                        //     var linStr = `${creature}-`;
                        //     if (spawn.lineage_data[i]) linStr += `${spawn.lineage_data[i]}-`;
                        //     linStr += `${prob}`;
                        //     return linStr;
                        // }).join(', ');
                        // spawnStr += lineageStr;
                        spawnStr += "NONE-0";
                        lines.push(spawnStr);
                    } else {
                        spawnStr += `${room} : ${den}-NONE`;
                        // spawnStr += `${room} : ${den}-${creature}`;
                        // if (spawnData) spawnStr += `-${spawnData}`;
                        // if (amount > 1) spawnStr += `-${amount}`;
                        if (!origSpawnsMap[room].includes(spawnStr))
                            origSpawnsMap[room].push(spawnStr);
                    }
                    // lines.push("[FINDLINEREGEX].*" + spawnStr + ".*");
                    // lines.push("[REPLACE]");
                }
            }

            for (const [key, value] of Object.entries(origSpawnsMap)) {
                if (value.length > 0)
                {
                    var str = value[0];
                    for (var i = 1; i < value.length; i++)
                    {
                        str += ", " + value[i].split(" : ")[1];
                    }
                    lines.push(str);
                }
            }

            var spawnsMap = {};
            // lines.push("[MERGE]");
            // lines.push("CREATURES");
            for (const feature of spawnFeatures) {
                var room = feature.properties.room;
                if (room.toLowerCase().includes("offscreen"))
                    room = "OFFSCREEN";
                if (spawnsMap[room] == null)
                    spawnsMap[room] = [];
                const den = feature.properties.den;
                for (const spawn of feature.properties.spawns) {
                    var creature = spawn.creature;
                    const amount = spawn.amount;
                    const spawnData = spawn.spawn_data ?? '';
                    var spawnStr = `(${loadedDifficulty.charAt(0).toUpperCase() + loadedDifficulty.slice(1)})`;
                    if (spawn.is_lineage) {
                        spawnStr += "LINEAGE : ";
                        spawnStr += `${room} : ${den} : `;
                        const lineageStr = spawn.lineage.map((creature, i) => {
                            const prob = parseFloat(spawn.lineage_probs[i]).toString();
                            if (creature === "")
                                creature = "NONE";
                            var linStr = `${creature}-`;
                            if (spawn.lineage_data[i]) linStr += `${spawn.lineage_data[i]}-`;
                            linStr += `${prob}`;
                            return linStr;
                        }).join(', ');
                        spawnStr += lineageStr;
                        lines.push(spawnStr);
                    } else {
                        spawnStr += `${room} : ${den}-${creature}`;
                        if (spawnData) spawnStr += `-${spawnData}`;
                        if (amount > 1) spawnStr += `-${amount}`;
                        spawnsMap[room].push(spawnStr);
                    }
                }
            }

            for (const [key, value] of Object.entries(spawnsMap)) {
                if (value.length > 0)
                {
                    var str = value[0];
                    for (var i = 1; i < value.length; i++)
                    {
                        str += ", " + value[i].split(" : ")[1];
                    }
                    lines.push(str);
                }
            }

            lines.push("END CREATURES");
            lines.push("[ENDMERGE]");
            return lines.join('\n');
        }

        const exportBtn = document.getElementById('exportBtn');
        exportBtn.addEventListener('click', async () => {
            exportBtn.disabled = true;

            try {
                const zip = new JSZip();
                const modifyFolder = zip.folder('modify');
                const worldFolder = modifyFolder.folder('world');
                const regionFolder = worldFolder.folder(region.toLowerCase());
                regionFolder.file(`world_${region.toLowerCase()}.txt`, spawnFeaturesToWorldTxt(regionJson[`${loadedDifficulty}-${region}`]["spawn_features"], originalRegionJson[`${loadedDifficulty}-${region}`]["spawn_features"]));
                
                var roomSettingsMap = {};
                var regionSettingsFolder = worldFolder.folder(region.toLowerCase() + "-rooms");
                var filterList = ["White", "Yellow", "Red", "Rivulet", "Artificer", "Saint", "Spear", "Gourmand", "Watcher"].filter(c => c !== loadedDifficulty.charAt(0).toUpperCase() + loadedDifficulty.slice(1));

                for (var placedObj of regionJson[`${loadedDifficulty}-${region}`]["placed_objects"]) {
                    const objData = new PlacedObjectData(placedObj.properties.object, placedObj.properties.position, placedObj.properties.room);
                    const roomKey = placedObj.properties.room.toLowerCase();
                    const settingsStr = objData.toRoomSettingsString(loadedDifficulty, filterList);

                    if (!roomSettingsMap[roomKey]) {
                        roomSettingsMap[roomKey] = `PlacedObjects: ${settingsStr}`;
                    } else {
                        roomSettingsMap[roomKey] += settingsStr;
                    }
                }

                for (const [key, value] of Object.entries(roomSettingsMap)) {
                    regionSettingsFolder.file(`${key}_settings.txt`, `[MERGE]\n${value}\n[ENDMERGE]`);
                }

                const blob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `map_export_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.zip`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error('Export failed:', err);
                alert('Export failed');
            } finally {
                exportBtn.disabled = false;
            }
        });

        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');

        uploadBtn.addEventListener('click', () => fileInput.click());

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsText(file);
            });
        }

        fileInput.addEventListener('change', async (e) => {
            var hasSettings = Array.from(e.target.files).some(file => file.name.includes("settings"));
            if (e.target.files.length === 1 && !hasSettings)
            {
                const file = e.target.files[0];
                uploadBtn.disabled = true;
                const text = await readFileAsText(file);

                const world = file.name.split(".txt")[0].split("_")[1];
                if (world.toLowerCase() == region.toLowerCase())
                {
                    regionJson[`${loadedDifficulty}-${region}`]["spawn_features"] = [];
                    const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 0 && l !== "[MERGE]" && l !== "[ENDMERGE]" && l !== "CREATURES" && l !== "END CREATURES" && !l.includes("REPLACE") && !l.includes("FIND") && !l.includes("ADD"));
                    for (const line of lines)
                    {
                        var [_, diff, rest] = line.match(/^\(([^)]+)\)(.*)$/);
                        if (diff.toLowerCase() !== loadedDifficulty.toLowerCase())
                            continue;
                        var parts = rest.split(" : ");
                        if (parts.length === 4)
                        {
                            var room = parts[1];
                            if (room === "OFFSCREEN")
                                room = "OffScreenDen_" + region;
                            var den = parts[2];
                            var spawns = parts[3];
                            var individualSpawns = spawns.split(", ");
                            var spawnData = null;
                            var spawnCret = null;
                            var spawnProb = null;
                            if (individualSpawns[0].split("-").length > 2)
                                spawnData = individualSpawns[0].split("-")[1];

                            const spawn = {
                                is_lineage: true,
                                amount: 1,
                                creature: individualSpawns[0].split("-")[0] === "NONE" ? "" : spawnParts[0],
                                spawn_data: spawnData === null ? null : spawnData
                            };

                            const lineage = [];
                            const lineageProbs = [];
                            const lineageData = [];
                            for (var linSpawn of individualSpawns) {
                                var spawnParts = linSpawn.split("-");
                                spawnData = null;
                                if (spawnParts.length > 2)
                                {
                                    spawnCret = spawnParts[0] === "NONE" ? "" : spawnParts[0];
                                    spawnData = spawnParts[1];
                                    spawnProb = spawnParts[2];
                                }
                                else
                                {
                                    spawnCret = spawnParts[0] === "NONE" ? "" : spawnParts[0];
                                    spawnProb = spawnParts[1];
                                }
                                lineage.push(spawnCret);
                                lineageProbs.push(spawnProb);
                                lineageData.push(spawnData === null ? null : spawnData);
                            }
                            spawn.lineage = lineage;
                            spawn.lineage_probs = lineageProbs;
                            spawn.lineage_data = lineageData;

                            if (spawn.lineage.every(s => s === ""))
                                continue;

                            const newSpawnFeature = {
                                type: "Feature",
                                properties: {
                                    room: room,
                                    den: parseInt(den),
                                    spawns: [spawn]
                                }
                            };
                            var node = spawnToNode(newSpawnFeature, loadedDifficulty);
                            newSpawnFeature["geometry"] = {
                                type: "Point",
                                coordinates: [node.geometry.coordinates[0], node.geometry.coordinates[1]]
                            };

                            var currSpawnFeature = nodeToSpawn(node, loadedDifficulty);
                            if (!currSpawnFeature)
                            {
                                regionJson[`${loadedDifficulty}-${region}`]["spawn_features"].push(newSpawnFeature);
                            }
                            else
                            {
                                currSpawnFeature.properties.spawns.push(spawn);
                            }
                        }
                        else
                        {
                            var room = parts[0];
                            if (room === "OFFSCREEN")
                                room = "OffScreenDen_" + region;
                            var spawns = parts[1];
                            var individualSpawns = spawns.split(", ");
                            for (var indviSpawn of individualSpawns)
                            {
                                var spawnAm = null;
                                var spawnCret = null;
                                var spawnData = null;
                                var parts = indviSpawn.split("-");
                                var den = parts[0];
                                spawnCret = parts[1];
                                if (spawnCret === "NONE")
                                    continue;
                                switch (parts.length)
                                {
                                    case 2:
                                        spawnAm = 1;
                                        break;
                                    case 3:
                                        if (parts[2].includes("{"))
                                        {
                                            spawnData = parts[2];
                                            spawnAm = 1;
                                        }
                                        else
                                            spawnAm = parts[2];
                                        break;
                                    case 4:
                                        spawnData = parts[2];
                                        spawnAm = parts[3];
                                        break;
                                }

                                const spawn = {
                                    is_lineage: false,
                                    amount: Number(spawnAm),
                                    creature: spawnCret,
                                    spawn_data: spawnData === null ? null : spawnData
                                };

                                const newSpawnFeature = {
                                    type: "Feature",
                                    properties: {
                                        room: room,
                                        den: parseInt(den),
                                        spawns: [spawn]
                                    }
                                };
                                var node = spawnToNode(newSpawnFeature, loadedDifficulty);
                                newSpawnFeature["geometry"] = {
                                    type: "Point",
                                    coordinates: [node.geometry.coordinates[0], node.geometry.coordinates[1]]
                                };

                                var currSpawnFeature = nodeToSpawn(node, loadedDifficulty);
                                if (!currSpawnFeature)
                                {
                                    regionJson[`${loadedDifficulty}-${region}`]["spawn_features"].push(newSpawnFeature);
                                }
                                else
                                {
                                    currSpawnFeature.properties.spawns.push(spawn);
                                }
                            }
                        }
                    }

                    if (regionJson[`${loadedDifficulty}-${region}`]["spawn_features"].length > 0)
                        drawSpawns(loadedDifficulty);
                }
            }
            else
            {
                const files = Array.from(e.target.files);
                uploadBtn.disabled = true;
                for (const file of files) {
                    const text = await readFileAsText(file);
                    const world = file.name.split(".txt")[0].split("_")[0];
                    var roomParts = file.name.split(".txt")[0].split("_");
                    const room = roomParts[0] + "_" + roomParts[1];

                    if (world.toLowerCase() == region.toLowerCase())
                    {
                        regionJson[`${loadedDifficulty}-${region}`]["placed_objects"] = regionJson[`${loadedDifficulty}-${region}`]["placed_objects"].filter(obj => obj.properties.room.toLowerCase() !== room.toLowerCase());

                        const lines = text.split("\n").filter(l => l.length > 0 && l !== "[MERGE]" && l !== "[ENDMERGE]" && l !== "CREATURES" && l !== "END CREATURES" && !l.includes("REPLACE") && !l.includes("FIND") && !l.includes("ADD"));

                        for (const line of lines)
                        {
                            if (line.startsWith("PlacedObjects: "))
                            {
                                const settingsStr = line.replace("PlacedObjects: ", "").trim();
                                const objDataList = settingsStr.split(", ").filter(s => !s.includes("Filter"));
                                var i = 0;
                                for (const objDataStr of objDataList)
                                {
                                    const objData = fromRoomSettingsLine(objDataStr, room);
                                    if (objData)
                                    {
                                        objData.id = objData.id + "_" + i++; // Timestamp not unique since objects mass added at once
                                        const devPos = regionJson[`${loadedDifficulty}-${region}`]["room_devPos"].find(node => node.properties.room.toLowerCase() === room.toLowerCase());
                                        var x = objData.position[0];
                                        var y = objData.position[1];

                                        regionJson[`${loadedDifficulty}-${region}`]["placed_objects"].push(objData.toGeoJSONFeature([x + devPos.geometry.coordinates[0], y + devPos.geometry.coordinates[1]]));
                                    }
                                }
                            }
                        }
                    }
                }
                drawPlacedObjects(loadedDifficulty);
            }

            uploadBtn.disabled = false;
            fileInput.value = '';
        });


        // Region stuff
        function drawSpawns(pdifficulty) {
            let hadSpawns = map.hasLayer(densLayer) || loadedRegion == null;
            if (densLayer != null) {
                overlays.removeLayer(densLayer);
                map.removeLayer(densLayer);
            }
            densLayer = L.geoJSON(regionJson[`${pdifficulty}-${region}`]["spawn_features"], {
                pointToLayer: function (feature, latlng) {
                    // Spawns are organized by dens, dens list spawns in it, flexbox stacks them visually on the den location, filter classes control visib
                    let divhtml = "";
                    for (let spawn of feature.properties.spawns) {
                        let spawn_filter = " spawn-filter";
                        if (spawn.is_lineage) {
                            // lineages are vertical stacks
                            divhtml += '<div class="spawn-entry ' + spawn_filter + '">';
                            for (let i = 0; i < spawn.lineage.length; i++) {
                                let tooltip = "";
                                let rottype = 0;
                                if (spawn.lineage_data != null && spawn.lineage_data[i] != null && spawn.lineage_data[i].length > 2) {
                                    let spawndata = spawn.lineage_data[i].substring(1, spawn.lineage_data[i].length - 1).split("|").map(x => x.trim()).filter(x => isNaN(x));

                                    if (spawndata.indexOf("Night") > -1) {
                                        tooltip += "🌙";
                                        spawndata.splice(spawndata.indexOf("Night"), 1);
                                    }
                                    if (spawndata.indexOf("PreCycle") > -1) {
                                        tooltip += "🚿";
                                        spawndata.splice(spawndata.indexOf("PreCycle"), 1);
                                    }
                                    if (spawndata.indexOf("Winter") > -1) {
                                        tooltip += "❄️";
                                        spawndata.splice(spawndata.indexOf("Winter"), 1);
                                    }
                                    if (spawndata.findIndex(x => x.startsWith("RotType")) > -1) {
                                        let rotflag = spawndata.find(x => x.startsWith("RotType"));
                                        switch (rotflag) {
                                            case "RotType:1":
                                            case "RotType:2":
                                                rottype = 1;
                                                break;
                                            case "RotType:3":
                                                rottype = 2;
                                                break;
                                        }
                                        // spawndata.splice(spawndata.findIndex(x => x.startsWith("RotType")), 1);
                                    }
                                    if (spawndata.findIndex(x => x.startsWith("NamedAttr")) > -1) {
                                        spawndata.splice(spawndata.findIndex(x => x.startsWith("NamedAttr")));
                                    }
                                    if (tooltip.length > 0) tooltip += ", ";
                                    tooltip += spawndata.join(", ");
                                }

                                let icon = spawn.lineage[i].toLowerCase();
                                if (rottype > 0) icon = icon + "_" + rottype;
                                let path = "./resources/icons/" + icon + ".png";
                                if (spawn.lineage[i] == "") path = "./resources/none.png";
                                divhtml += `<div class="lineage-entry${rottype > 0 ? " tall" : ""}">
                                    <img class="icon-image" src="${path}"/>
                                    <div class="icon-label">${Math.trunc(Number.parseFloat(spawn.lineage_probs[i]) * 100)}%</div>
                                    <div class="icon-tooltip">${tooltip}</div>
                                    </div>`;
                            }
                            divhtml += '</div>';
                        } else {
                            let tooltip = "";
                            let rottype = 0;
                            let altform = false;
                            if (spawn.spawn_data != null && spawn.spawn_data.length > 2) {
                                let spawndata = spawn.spawn_data.substring(1, spawn.spawn_data.length - 1).split("|").map(x => x.trim()).filter(x => isNaN(x));

                                if (spawndata.indexOf("Night") > -1) {
                                    tooltip += "🌙";
                                    spawndata.splice(spawndata.indexOf("Night"), 1);
                                }
                                if (spawndata.indexOf("PreCycle") > -1) {
                                    tooltip += "🚿";
                                    spawndata.splice(spawndata.indexOf("PreCycle"), 1);
                                }
                                if (spawndata.indexOf("Winter") > -1) {
                                    tooltip += "❄️";
                                    spawndata.splice(spawndata.indexOf("Winter"), 1);
                                }
                                if (spawndata.findIndex(x => x.startsWith("RotType")) > -1) {
                                    let rotflag = spawndata.find(x => x.startsWith("RotType"));
                                    switch (rotflag) {
                                        case "RotType:1":
                                        case "RotType:2":
                                            rottype = 1;
                                            break;
                                        case "RotType:3":
                                            rottype = 2;
                                            break;
                                    }
                                    // spawndata.splice(spawndata.findIndex(x => x.startsWith("RotType")), 1);
                                }
                                if (spawndata.findIndex(x => x.startsWith("NamedAttr")) > -1) {
                                    spawndata.splice(spawndata.findIndex(x => x.startsWith("NamedAttr")), 1);
                                }
                                if (spawndata.indexOf("AlternateForm") > -1) {
                                    altform = true;
                                    spawndata.splice(spawndata.indexOf("AlternateForm"), 1);
                                }
                                if (tooltip.length > 0) tooltip += ", ";
                                tooltip += spawndata.join(", ");
                            }
                            let icon = spawn.creature.toLowerCase();
                            if (altform && icon == "skywhale") icon = "altskywhale";
                            if (rottype > 0) icon = icon + "_" + rottype;
                            let path = "./resources/icons/" + icon + ".png";
                            divhtml += `<div class="spawn-entry${spawn_filter}">
                                <img class="icon-image" src="${path}"/>
                                <div class="icon-label">x${spawn.amount}</div>
                                <div class="icon-tooltip">${tooltip}</div>
                                </div>`;
                        }
                    }
                    return L.marker(latlng, {
                        icon: L.divIcon({
                            className: 'spawn-divs',
                            html: divhtml,
                        }),
                        interactive: false,
                    });
                },
            });
            if (hadSpawns) densLayer.addTo(map);
            overlays.addOverlay(densLayer, "Spawns");

            let hadCreatureDens = map.hasLayer(creatureDenLayer) || loadedRegion == null;
            if (creatureDenLayer != null) {
                overlays.removeLayer(creatureDenLayer);
                map.removeLayer(creatureDenLayer);
            }
            creatureDenLayer = L.geoJSON(regionJson[`${pdifficulty}-${region}`]["room_nodes"], {
                pointToLayer: function (feature, latlng) {
                    return L.marker(latlng, {
                        icon: L.divIcon({
                            className: "creature-den-divs",
                            html: nodeToSpawn(feature, pdifficulty) != null && nodeToSpawn(feature, pdifficulty).properties.spawns.length > 0 ? `<div class="creature-den-entry" style="width: 62px;height: 62px;outline: 1px dashed red;margin: auto"></div>` : '<img class="object-image" src="./resources/none.png" style="width: 62px;height: 62px;outline: 1px dashed red;margin: auto"/>',
                            iconSize: [62, 62],
                        })
                    });
                },

        // My weird lisp parsing system for the placed object data
        /**
         * Rule parser thingy. Secretly has very loose parsing, not that it's intended, just that I was too lazy to fill in some of it.
         * @param {string} rule A rule parenthesis or string
         * @param {Map<string, string>} values The values for some instructions
         * @returns {*} Whatever the result of the rule is
         */
        function parseRule(rule, values) {
            if (typeof rule != "string") {
                throw new SyntaxError("Error parsing rule! Not of type string");
            }

            rule = rule.trim();
            if (rule.length == 0) return "";
            if (rule[0] == "(" && rule[rule.length - 1] == ")") {
                // Parenthesis
                rule = rule.substring(1, rule.length - 1);
                let keyword = rule.indexOf(" ") != -1 ? rule.substring(0, rule.indexOf(" ")) : rule;
                let args = [];

                // Split the thingy
                let inWhitespace = true;
                let tempValue = "";
                let stack = [];
                for (let i = keyword.length + 1; i < rule.length; i++) {
                    if (stack.length > 0) {
                        switch (stack[0]) {
                            case "'": {
                                if (rule[i] == "'") {
                                    stack.shift();
                                    tempValue += rule[i];
                                } else if (rule[i] == "\\") {
                                    // Skip the next value in processing but add both to tempValue
                                    tempValue += rule[i] + rule[i + 1];
                                    i++;
                                } else {
                                    tempValue += rule[i];
                                }
                                break;
                            }
                            case "(": {
                                if (rule[i] == "(") {
                                    stack.unshift("(");
                                } else if (rule[i] == "'") {
                                    stack.unshift("'");
                                } else if (rule[i] == ")") {
                                    stack.shift();
                                }
                                tempValue += rule[i];
                                break;
                            }
                            default: {
                                throw new TypeError("Unknown string in stack! (" + stack[0] + ")");
                            }
                        }
                    } else {
                        if (rule[i] == " ") {
                            if (!inWhitespace) {
                                inWhitespace = true;
                                args.push(tempValue);
                            }
                        } else {
                            if (inWhitespace) {
                                inWhitespace = false;
                                tempValue = "";
                            }

                            if (rule[i] == "(") {
                                stack.unshift("(");
                            } else if (rule[i] == "'") {
                                stack.unshift("'");
                            }
                            tempValue += rule[i];
                        }
                    }
                }
                args.push(tempValue);
                if (stack.length > 0) {
                    throw new SyntaxError("Mismatched parenthesis!");
                }

                // Parse the arguments (this will also weed out any syntax errors)
                args = args.map(x => parseRule(x, values));

                // Okay ! yippee now we can do code stuff
                switch (keyword) {
                    case "": {
                        return "";
                    }
                    case "default": {
                        if (!values.has("default")) {
                            throw new SyntaxError("The use of 'default' is not allowed here!");
                        }
                        return values.get("default");
                    }
                    case "slugcat": {
                        if (!values.has("slugcat")) {
                            throw new SyntaxError("The use of 'slugcat' is not allowed here!");
                        }
                        return values.get("slugcat");
                    }
                    case "setting": {
                        if (!values.has("settings")) {
                            throw new SyntaxError("The use of 'settings' is not allowed here!");
                        }
                        let settings = values.get("settings");
                        if (args.length < 1) {
                            throw new SyntaxError("(settings num) requires at least 1 argument!");
                        }
                        let num = parseInt(args[0]);
                        if (isNaN(num)) {
                            throw new SyntaxError("(settings num) expects an integer as first argument!");
                        } else if (num < 0 || num > settings.length) {
                            throw new RangeError("(settings num) expects a number [0, length of settings)! (this is range syntax for you uncultured people)")
                        }
                        return settings[num];
                    }
                    case "true": return true;
                    case "false": return false;
                    case "array": return args; // this can return empty array. that's intended.
                    case "string": {
                        if (args.length == 1) return args[0].toString();
                        else throw new SyntaxError("(string arg) expects exactly one argument!");
                    }
                    case "number": {
                        if (args.length == 1) return Number(args[0]);
                        else throw new SyntaxError("(number arg) expects exactly one argument!");
                    }
                    case "+": {
                        if (args.length < 2) {
                            throw new SyntaxError("(+ args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(+ args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev + curr);
                    }
                    case "-": {
                        if (args.length < 2) {
                            throw new SyntaxError("(- args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(- args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev - curr);
                    }
                    case "*": {
                        if (args.length < 2) {
                            throw new SyntaxError("(* args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(* args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev * curr);
                    }
                    case "/": {
                        if (args.length < 2) {
                            throw new SyntaxError("(/ args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(/ args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev / curr);
                    }
                    case "%": {
                        if (args.length < 2) {
                            throw new SyntaxError("(% args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(% args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev % curr);
                    }
                    case "**": {
                        if (args.length < 2) {
                            throw new SyntaxError("(** args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(** args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev ** curr);
                    }
                    case "&": {
                        if (args.length < 2) {
                            throw new SyntaxError("(& args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(& args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev & curr);
                    }
                    case "|": {
                        if (args.length < 2) {
                            throw new SyntaxError("(| args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(| args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev | curr);
                    }
                    case "^": {
                        if (args.length < 2) {
                            throw new SyntaxError("(^ args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(^ args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev ^ curr);
                    }
                    case "~": {
                        if (args.length < 1) {
                            throw new SyntaxError("(~ arg) expects at least one argument!");
                        } else if (typeof args[0] != "number") {
                            throw new SyntaxError("(~ arg) expects a number as first argument!");
                        }
                        return ~args[0];
                    }
                    case ">": {
                        if (args.length < 2) {
                            throw new SyntaxError("(> args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(> args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev > curr);
                    }
                    case "<": {
                        if (args.length < 2) {
                            throw new SyntaxError("(< args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(< args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev < curr);
                    }
                    case ">=": {
                        if (args.length < 2) {
                            throw new SyntaxError("(>= args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(>= args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev >= curr);
                    }
                    case "<=": {
                        if (args.length < 2) {
                            throw new SyntaxError("(<= args...) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "number")) {
                            throw new SyntaxError("(<= args...) expects all its arguments to be numbers! Argument " + (args.findIndex(x => typeof x != "number") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev <= curr);
                    }
                    case "==": {
                        if (args.length < 2) {
                            throw new SyntaxError("(== args...) requires at least two arguments!");
                        }
                        return args.reduce((prev, curr) => prev == curr);
                    }
                    case "!=": {
                        if (args.length < 2) {
                            throw new SyntaxError("(!= args...) requires at least two arguments!");
                        }
                        return args.reduce((prev, curr) => prev != curr);
                    }
                    case "&&":
                    case "and": {
                        if (args.some(x => typeof x != "boolean")) {
                            throw new SyntaxError("(and args...) expects all its arguments to be booleans! Argument " + (args.findIndex(x => typeof x != "boolean") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev && curr);
                    }
                    case "||":
                    case "or": {
                        if (args.some(x => typeof x != "boolean")) {
                            throw new SyntaxError("(or args...) expects all its arguments to be booleans! Argument " + (args.findIndex(x => typeof x != "boolean") + 1) + " was not.");
                        }
                        return args.reduce((prev, curr) => prev || curr);
                    }
                    case "!":
                    case "not": {
                        if (args.length < 1) {
                            throw new SyntaxError("(not arg) expects at least one argument!");
                        } else if (typeof args[0] != "boolean") {
                            throw new SyntaxError("(not arg) expects a boolean as first argument!");
                        }
                        return !args[0];
                    }
                    case "if": {
                        if (typeof args[0] != "boolean") {
                            throw new SyntaxError("(if condition valueIfTrue valueIfFalse?) expects a boolean as first argument!");
                        } else if (args.length < 2) {
                            throw new SyntaxError("(if condition valueIfTrue valueIfFalse?) requires at least 2 arguments!")
                        } else {
                            return args[0] ? args[1] : (args[2] ?? "");
                        }
                    }
                    case "round": {
                        if (args.length < 1) {
                            throw new SyntaxError("(round arg) expects at least one argument!");
                        } else if (typeof args[0] != "number") {
                            throw new SyntaxError("(round arg) expects a number as first argument!");
                        }
                        return Math.round(args[0]);
                    }
                    case "floor": {
                        if (args.length < 1) {
                            throw new SyntaxError("(floor arg) expects at least one argument!");
                        } else if (typeof args[0] != "number") {
                            throw new SyntaxError("(floor arg) expects a number as first argument!");
                        }
                        return Math.floor(args[0]);
                    }
                    case "ceil": {
                        if (args.length < 1) {
                            throw new SyntaxError("(ceil arg) expects at least one argument!");
                        } else if (typeof args[0] != "number") {
                            throw new SyntaxError("(ceil arg) expects a number as first argument!");
                        }
                        return Math.ceil(args[0]);
                    }
                    case "trunc": {
                        if (args.length < 1) {
                            throw new SyntaxError("(trunc arg) expects at least one argument!");
                        } else if (typeof args[0] != "number") {
                            throw new SyntaxError("(trunc arg) expects a number as first argument!");
                        }
                        return Math.trunc(args[0]);
                    }
                    case "sqrt": {
                        if (args.length < 1) {
                            throw new SyntaxError("(sqrt arg) expects at least one argument!");
                        } else if (typeof args[0] != "number") {
                            throw new SyntaxError("(sqrt arg) expects a number as first argument!");
                        }
                        return Math.sqrt(args[0]);
                    }
                    case "lower": {
                        if (args.length < 1) {
                            throw new SyntaxError("(lower arg) expects at least one argument!");
                        } else if (typeof args[0] != "string") {
                            throw new SyntaxError("(lower arg) expects a string as first argument!");
                        }
                        return args[0].toLowerCase();
                    }
                    case "upper": {
                        if (args.length < 1) {
                            throw new SyntaxError("(upper arg) expects at least one argument!");
                        } else if (typeof args[0] != "string") {
                            throw new SyntaxError("(upper arg) expects a string as first argument!");
                        }
                        return args[0].toUpperCase();
                    }
                    case "split": {
                        if (args.length < 2) {
                            throw new SyntaxError("(split string delimiter) requires at least two arguments!");
                        } else if (args.some(x => typeof x != "string")) {
                            throw new SyntaxError("(split string delimiter) expects all its arguments to be strings! Argument " + (args.findIndex(x => typeof x != "string") + 1) + " was not.");
                        }
                        return args[0].split(args[1]);
                    }
                    case "join": {
                        if (args.some(x => typeof x != "string")) {
                            throw new SyntaxError("(join args...) expects all its arguments to be strings! Argument " + (args.findIndex(x => typeof x != "string") + 1) + " was not.");
                        }
                        return args.join("");
                    }
                    case "joinwith": {
                        if (args.some(x => typeof x != "string")) {
                            throw new SyntaxError("(joinwith separator args...) expects all its arguments to be strings! Argument " + (args.findIndex(x => typeof x != "string") + 1) + " was not.");
                        }
                        return args.slice(1).join(args[0]);
                    }
                    case "contains": {
                        if (args.length < 2) {
                            throw new SyntaxError("(contains container item) requires at least two arguments!");
                        } else if (typeof args[1] != "string") {
                            throw new SyntaxError("(contains container item) expects a string as second argument!");
                        } else if (typeof args[0] == "string" || args[0] instanceof Array) {
                            return args[0].indexOf(args[1]) > -1;
                        } else {
                            throw new SyntaxError("(contains container item) expects a string or array as first argument!");
                        }
                    }
                    case "index": {
                        if (args.length < 2) {
                            throw new SyntaxError("(index container item) requires at least two arguments!");
                        } else if (typeof args[1] != "string") {
                            throw new SyntaxError("(index container item) expects a string as second argument!");
                        } else if (typeof args[0] == "string" || args[0] instanceof Array) {
                            return args[0].indexOf(args[1]);
                        } else {
                            throw new SyntaxError("(index container item) expects a string or array as first argument!");
                        }
                    }
                    default: {
                        return parseRule(rule, values); // maybe it's unnecessary parenthesis?
                    }
                }
            }
            else if (rule[0] == "'" && rule[rule.length - 1] == "'") {
                // String
                rule = rule.substring(1, rule.length - 1);
                let str = "";
                for (let i = 0; i < rule.length; i++) {
                    if (rule[i] == "'") {
                        throw new SyntaxError("Error parsing string: too many ' characters");
                    } else if (rule[i] == "\\") {
                        if (i == rule.length - 1) {
                            throw new SyntaxError("Expected character after escape in string!");
                        } else {
                            switch (rule[i + 1]) {
                                case "\\":
                                case "'":
                                    str += rule[i + 1];
                                    break;
                                case "n":
                                    str += "\n";
                                    break;
                                default:
                                    console.warn("Unknown escape sequence: \\" + rule[i + 1]);
                                    break;
                            }
                        }
                    } else {
                        str += rule[i];
                    }
                }
                return str;
            }
            else if (/^(?:\d+\.?|\d*\.\d+)$/m.test(rule) && !isNaN(Number(rule))) {
                return Number(rule);
            }
            else {
                throw new SyntaxError("Error parsing rule {" + rule + "}: either did not begin with (, ', or number or end with the corresponding matching character!");
            }
        }

        function initializePlacedObjectMenu() {
            const menu = document.getElementById('placedObjectMenu');
            menu.innerHTML = '';

            for (const objectType of PLACED_OBJECT_TYPES) {
                const item = document.createElement('div');
                item.className = 'placed-object-menu-item';
                item.innerHTML = `
                    <img src="./resources/icons/${objectTypeToImage(objectType)}.png" />
                    ${objectType}
                `;
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    placeSelectedObject(objectType);
                });
                menu.appendChild(item);
            }
        }

        // Collapseable things
        var uncollapsed = null;
        var collapsible = document.querySelectorAll(".collapsible");
        for (const el of collapsible) {
            var button = el.querySelector(".collapse-tab");
            button.addEventListener("click", (e) => {
                if (uncollapsed != null) {
                    uncollapsed.classList.add("collapsed");
                }
                if (uncollapsed == el) {
                    uncollapsed = null;
                } else {
                    uncollapsed = el;
                    el.classList.remove("collapsed");
                }
            });
        }
        function setCollapsibleWidths() {
            for (const el of collapsible) {
                el.style.setProperty("--hide-pos", "-" + (el.getBoundingClientRect().width) + "px");
            }
        }

    </script>
